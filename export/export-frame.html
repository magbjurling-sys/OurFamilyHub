<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OFH scene render target</title>
<link href="./vendor/fonts.css" rel="stylesheet">
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./vendor/babel.min.js"></script>
<script src="./audit.js"></script>
<style>
  html, body { margin: 0; background: #0B0A1F; overflow: hidden; }
  /* Exact 1:1 stage box: Stage scales by min(w/1280, (h-44)/720) → 1.0 */
  #root { position: relative; width: 1280px; height: 764px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
window.__err = null;
window.addEventListener('error', e => { window.__err = 'window error: ' + (e.message || e); });
(async function () {
 try {
  const q = new URLSearchParams(location.search);
  const [engine, scenes] = await Promise.all([
    fetch('../animations.jsx').then(r => r.text()),
    fetch('../howto-scenes.jsx').then(r => r.text()),
  ]);
  // The two files are evaluated separately, exactly like the site's
  // <x-import from="a b">: the engine publishes its primitives on window, and
  // howto-scenes.jsx reads them back off window.
  const PUBLISH = ['Stage', 'Sprite', 'TextSprite', 'ImageSprite', 'RectSprite', 'VideoSprite',
    'TimelineContext', 'SpriteContext', 'useTime', 'useTimeline', 'useSprite',
    'Easing', 'interpolate', 'animate', 'clamp', 'lerp', 'PlaybackBar', 'IconButton'];
  const engineSrc = Babel.transform(
    engine + '\n;' + JSON.stringify(PUBLISH) + '.forEach(function(n){try{window[n]=eval(n)}catch(e){}});',
    { presets: ['react'] }).code;
  new Function('React', 'ReactDOM', engineSrc)(React, ReactDOM);

  const sceneSrc = Babel.transform(scenes, { presets: ['react'] }).code;
  new Function('React', 'ReactDOM', sceneSrc)(React, ReactDOM);

  ReactDOM.createRoot(document.getElementById('root')).render(
    React.createElement(window.HowToEmbed, {
      tema: q.get('tema') || 'loop',
      sprak: q.get('sprak') || 'en',
      loop: 'false',
    }));

  const svg = () => document.querySelector('svg[data-om-exportable-video-with-duration-secs]');
  window.__ready = () => !!svg();
  window.__duration = () => parseFloat(svg().getAttribute('data-om-exportable-video-with-duration-secs'));
  // Deterministic frame stepping — the engine's own export protocol.
  window.__seek = (t) => {
    const el = svg();
    el.dispatchEvent(new CustomEvent('data-om-seek-to-time-frame', { detail: { time: t } }));
    return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  };
 } catch (e) {
  window.__err = String((e && e.stack) || e);
  console.error('render target failed:', window.__err);
 }
})();
</script>
</body>
</html>
