<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0B0A1F;color:#F1ECFF;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
#ofh-player{max-width:1080px;margin:0 auto;padding:24px 20px 56px}
#ofh-player header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
#ofh-player .back{color:#B6AED4;text-decoration:none;font-weight:700;font-size:.9rem;
  padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12)}
#ofh-player .back:hover{color:#F1ECFF}
#ofh-player h1{font-family:'Fredoka',sans-serif;font-weight:600;letter-spacing:-.5px;
  font-size:clamp(1.3rem,3vw,1.9rem);margin:0}
#ofh-player .stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:24px;
  overflow:hidden;border:1px solid rgba(255,255,255,.12);
  box-shadow:0 30px 70px rgba(0,0,0,.5);background:#0B0A1F}
#ofh-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0B0A1F}
#ofh-topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:12px;margin-top:26px}
#ofh-topics .topic{display:flex;align-items:center;gap:12px;text-decoration:none;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
  border-radius:16px;padding:13px 15px;color:#F1ECFF;font-weight:700;font-size:.98rem}
#ofh-topics .topic:hover{background:rgba(255,255,255,.09)}
#ofh-topics .topic.is-active{border-color:#FFC861;background:rgba(255,200,97,.10)}
#ofh-topics .em{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  font-size:20px;background:rgba(255,255,255,.06);flex:none}
#ofh-novideo{color:#B6AED4;padding:24px;text-align:center}
#ofh-novideo a{color:#FFC861}
</style>
</head>
<body>
<div id="ofh-player">
  <header>
    <a class="back" href="index.html" id="ofh-back">← <span id="ofh-back-label">All videos</span></a>
    <h1 id="ofh-title">How-to</h1>
  </header>
  <div class="stage">
    <video id="ofh-video"
           src="videos/howto-loop-en.mp4"
           poster="videos/howto-loop-en.jpg"
           width="1920" height="1080"
           controls autoplay playsinline preload="metadata">
      <p id="ofh-novideo">Your browser cannot play this video.
        <a id="ofh-dl" href="videos/howto-loop-en.mp4">Download it instead</a>.</p>
    </video>
  </div>
  <nav id="ofh-topics" aria-label="Topics"></nav>
</div>

<script>
(function(){
  /* Temaene og varighetene er kontrakten mot filnavnene i videos/.
     Alt valideres mot denne lista — aldri mot rå query-parametre. */
  var TOPICS = [
    { id:'setup',     em:'\uD83D\uDCF2', en:'Getting started',           no:'Kom i gang' },
    { id:'loop',      em:'\u2B50',        en:'The core loop',             no:'Kjernesl\u00f8yfa' },
    { id:'blocks',    em:'\uD83E\uDDE9', en:'Routines \u00b7 Tasks \u00b7 Cycles', no:'Rutiner \u00b7 Oppgaver \u00b7 Sykluser' },
    { id:'ladder',    em:'\uD83C\uDF81', en:'Reward ladder',             no:'Premie-stige' },
    { id:'cashout',   em:'\uD83D\uDCB8', en:'Cash out',                  no:'Cash out' },
    { id:'allowance', em:'\uD83D\uDCB0', en:'Weekly allowance',          no:'Ukel\u00f8nn' },
    { id:'morning',   em:'\uD83C\uDF05', en:'Morning Round',             no:'Morgenrunden' },
    { id:'widgets',   em:'\uD83D\uDDA5\uFE0F', en:'Widgets & StandBy',  no:'Widgets & StandBy' },
    { id:'ownphone',  em:'\uD83D\uDCF1', en:'Their own phone',           no:'Egen telefon' }
  ];
  var q    = new URLSearchParams(location.search);
  var lang = q.get('sprak') === 'no' ? 'no' : 'en';
  var want = q.get('tema');
  var topic = TOPICS.filter(function(t){ return t.id === want; })[0] || TOPICS[1];

  var base  = 'videos/howto-' + topic.id + '-' + lang;
  var video = document.getElementById('ofh-video');
  video.src = base + '.mp4';
  video.poster = base + '.jpg';
  document.getElementById('ofh-dl').href = base + '.mp4';

  var title = topic[lang];
  document.getElementById('ofh-title').textContent = title;
  document.title = 'OurFamilyHub \u2014 ' + title;
  document.documentElement.lang = lang === 'no' ? 'nb' : 'en';

  var back = document.getElementById('ofh-back');
  back.href = (lang === 'no' ? 'index.no.html' : 'index.html') + '#videoer';
  document.getElementById('ofh-back-label').textContent =
    lang === 'no' ? 'Alle videoer' : 'All videos';
  document.getElementById('ofh-novideo').firstChild.nodeValue =
    lang === 'no' ? 'Nettleseren din kan ikke spille av denne videoen. ' : 'Your browser cannot play this video. ';
  document.getElementById('ofh-dl').textContent =
    lang === 'no' ? 'Last den ned i stedet' : 'Download it instead';

  /* Temavelger — bytter kilde uten sideskift, s\u00e5 ingenting lastes f\u00f8r brukeren ber om det. */
  var nav = document.getElementById('ofh-topics');
  TOPICS.forEach(function(t){
    var a = document.createElement('a');
    a.href = 'howto.html?tema=' + t.id + '&sprak=' + lang;
    a.className = 'topic' + (t.id === topic.id ? ' is-active' : '');
    a.innerHTML = '<span class="em">' + t.em + '</span><span>' + t[lang] + '</span>';
    a.addEventListener('click', function(ev){
      if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button) return;
      ev.preventDefault();
      var b = 'videos/howto-' + t.id + '-' + lang;
      video.src = b + '.mp4'; video.poster = b + '.jpg';
      document.getElementById('ofh-dl').href = b + '.mp4';
      document.getElementById('ofh-title').textContent = t[lang];
      document.title = 'OurFamilyHub \u2014 ' + t[lang];
      history.replaceState(null, '', a.href);
      nav.querySelectorAll('.topic').forEach(function(n){ n.classList.remove('is-active'); });
      a.classList.add('is-active');
      video.play().catch(function(){});
    });
    nav.appendChild(a);
  });
})();
</script>
</body>
</html>
